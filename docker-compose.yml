services:
  mongo:
    image: mongo:6
    container_name: webprobe-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - webprobe-net

  webprobe:
    build:
      context: .
      dockerfile: Dockerfile
    image: webprobe:latest
    container_name: webprobe-app
    ports:
      - "8080:8080"
    init: true
    ipc: host
    security_opt:
      - seccomp=./seccomp_profile.json
    user: "pwuser"
    environment:
      - JAVA_TOOL_OPTIONS=-Dplaywright.log=debug -Dplaywright.tmpdir=/pwtmp
    depends_on:
      - mongo
    networks:
      - webprobe-net

volumes:
  mongo-data:

networks:
  webprobe-net:
